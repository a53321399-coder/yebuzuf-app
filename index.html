<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>潘朵拉的寶盒｜花錢養愛豆</title>
<style>
:root{
  --red:#ff3b30; --blue:#1687ff; --yellow:#ffd21f; --green:#27c96f;
  --ink:#241f2b; --cream:#fff9ed; --paper:#fffdf7; --pink:#ff6fae;
  --purple:#8b5cf6; --shadow:0 6px 0 #241f2b;
}
*{box-sizing:border-box} body{margin:0;background:#fff3d8;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-weight:700}
button,input,select,textarea{font:inherit}
.app{max-width:720px;margin:auto;min-height:100vh;background:var(--cream);padding-bottom:88px}
.top{padding:16px 16px 10px;background:linear-gradient(135deg,#ffec3b,#ff5c8a 48%,#38bdf8);border-bottom:4px solid var(--ink)}
.cover{position:relative;height:170px;border:4px solid var(--ink);border-radius:18px;background:#fff;overflow:hidden;box-shadow:var(--shadow)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover-default{height:100%;display:grid;place-items:center;text-align:center;background:
  radial-gradient(circle at 15% 20%,#fff 0 7px,transparent 8px),
  radial-gradient(circle at 80% 25%,#fff 0 5px,transparent 6px),
  linear-gradient(135deg,#ff3b30 0 25%,#ffd21f 25% 50%,#27c96f 50% 75%,#1687ff 75%);
}
.cover-default h1{font-size:34px;margin:0;text-shadow:3px 3px 0 #fff}
.cover-default p{margin:8px 0;background:#fff;padding:5px 10px;border:3px solid var(--ink);display:inline-block}
.cover-edit{position:absolute;right:10px;bottom:10px}
.pixel{border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:4px 4px 0 var(--ink);padding:10px 14px;cursor:pointer;transition:.08s;touch-action:manipulation}
.pixel:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.red{background:var(--red);color:#fff}.blue{background:var(--blue);color:#fff}.yellow{background:var(--yellow)}.green{background:var(--green)}.purple{background:var(--purple);color:#fff}
.brand{display:flex;gap:10px;align-items:center;margin-top:12px}
.logo{width:48px;height:48px;border:4px solid var(--ink);border-radius:12px;background:var(--yellow);display:grid;place-items:center;font-size:25px;box-shadow:4px 4px 0 var(--ink)}
h1,h2,h3,p{margin-top:0}.brand h1{font-size:24px;margin:0}.brand small{display:block;font-weight:600}
.tabs{display:flex;gap:7px;padding:12px 10px;background:#fff;border-bottom:3px solid var(--ink);position:sticky;top:0;z-index:4;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{padding:10px 8px;border:3px solid var(--ink);border-radius:10px;background:#fff;font-size:12px;box-shadow:3px 3px 0 var(--ink);min-width:86px;flex:0 0 auto}
.tab.active{background:var(--yellow)}
main{padding:14px}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:5px 5px 0 var(--ink);padding:14px;margin-bottom:16px}
.hero-title{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hero-title h2{margin:0;font-size:23px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.statbox{border:3px solid var(--ink);border-radius:12px;padding:12px;background:#fff}
.statbox strong{display:block;font-size:25px}
.money{font-size:34px;line-height:1.1}
.list{display:grid;gap:10px}
.card{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:12px}
.card-head{display:flex;align-items:center;gap:10px;justify-content:space-between;cursor:pointer}
.card-head img.thumb{width:68px;height:68px;object-fit:cover;border:3px solid var(--ink);border-radius:10px;background:#eee}
.card-head .left{display:flex;gap:10px;align-items:center;min-width:0}
.card-head .title{font-size:18px;word-break:break-word}
.badge{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 8px;font-size:12px;margin-top:4px}
.details{display:none;margin-top:12px;border-top:3px dashed #aaa;padding-top:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{margin-bottom:10px}.field label{display:block;font-size:13px;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;border:3px solid var(--ink);border-radius:10px;padding:10px;background:#fff}
.field textarea{min-height:80px;resize:vertical}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.empty{text-align:center;padding:22px;color:#666}
.photo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}
.photo-grid img{width:100%;aspect-ratio:1;object-fit:cover;border:3px solid var(--ink);border-radius:10px}
.warn{background:#fff0d8;border:3px solid var(--red);border-radius:12px;padding:10px;margin-top:10px;color:#c21e16}
.ok{background:#dcffe9;border:3px solid var(--green);border-radius:12px;padding:10px;margin-top:10px}
.checks{display:grid;gap:7px}.check{display:flex;justify-content:space-between;align-items:center;border:3px solid var(--ink);border-radius:10px;padding:9px;background:#fff}
.check input{width:20px;height:20px;accent-color:var(--green)}
.home-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
.goal{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:7px}
.goal img{width:100%;aspect-ratio:1;object-fit:cover;border:2px solid var(--ink);border-radius:8px;max-height:150px}
.goal h3{margin:5px 0 2px;font-size:15px}.price{font-size:18px;color:#d11}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:20}
.modal.show{display:flex}.sheet{width:100%;max-height:92vh;overflow:auto;background:var(--cream);border:4px solid var(--ink);border-bottom:0;border-radius:20px 20px 0 0;padding:16px;box-shadow:0 -8px 0 #0003}
.modal-title{display:flex;justify-content:space-between;align-items:center}
@media(min-width:650px){.app{border-left:4px solid var(--ink);border-right:4px solid var(--ink)}.modal{align-items:center}.sheet{max-width:620px;border:4px solid var(--ink);border-radius:20px}}
.small{font-size:12px;color:#666;font-weight:600}.danger{color:#c21e16}.searchbar{display:flex;gap:7px;align-items:center;margin-top:10px}.searchbar input{flex:1;border:3px solid var(--ink);border-radius:10px;padding:9px;background:#fff;min-width:0}.searchbar button{white-space:nowrap}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style id="mobile-layout-fix">
html,body{width:100%;max-width:100%;overflow-x:hidden}
body{min-width:0}
.app{width:100%;max-width:none;min-width:0}
main{width:100%;max-width:100%;min-width:0}
.panel,.card,.list{max-width:100%;min-width:0}
.card-head,.card-head .left{min-width:0}
.card-head .title{overflow-wrap:anywhere}
.details{min-width:0}
.photo-grid{width:100%;max-width:100%}
@media(max-width:649px){
  .app{border-left:0;border-right:0}
  .top{padding:10px 10px 8px}
  .cover{height:170px}
  main{padding:10px}
  .panel,.card{padding:10px}
  .hero-title h2{font-size:20px}
  .money{font-size:31px}
  .row{grid-template-columns:1fr}
  .stat{grid-template-columns:1fr 1fr}
  .field input,.field select,.field textarea{max-width:100%}
  .sheet{width:100%;max-width:100%;padding:12px}
  .tabs{gap:5px;padding:9px 6px}
  .tab{padding:8px 2px;font-size:11px;min-width:78px;flex:0 0 auto}
}
@media(min-width:650px){
  .app{max-width:720px}
}

.sortbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:10px 0}.sortbar span{font-size:12px;color:#999}.sortbar .pixel{padding:7px 10px;font-size:11px}

<style id="new-pages-style">
.note-card,.list-card{position:relative}.color-dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);vertical-align:middle;margin-right:5px}.note-preview{white-space:pre-wrap;word-break:break-word;color:#666;font-weight:600}.note-card .details,.list-card .details{display:none}.category-pill{display:inline-block;padding:3px 8px;border-radius:999px;border:2px solid var(--ink);font-size:11px;margin-left:5px}.list-item{display:flex;align-items:center;gap:9px}.list-item input[type=checkbox]{width:22px;height:22px;flex:0 0 auto}.list-item.done{color:#999;background:#eee}.list-item.done .item-title{text-decoration:line-through}.check-actions{display:flex;gap:7px;flex-wrap:wrap}.shelf{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.shelf-item{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:8px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}.shelf-item img{width:100%;aspect-ratio:3/4;object-fit:cover;border:3px solid var(--ink);border-radius:10px;background:#eee}.shelf-title{font-size:15px;margin-top:6px;word-break:break-word}.shelf-meta{font-size:11px;color:#666;font-weight:700;margin-top:3px}.drama-row{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:9px;box-shadow:4px 4px 0 var(--ink);cursor:pointer}.drama-row img{width:72px;height:96px;object-fit:cover;border:3px solid var(--ink);border-radius:9px;background:#eee;flex:0 0 auto}.drama-main{min-width:0;flex:1}.drama-title{font-size:17px;word-break:break-word}.drama-meta{font-size:11px;color:#666;font-weight:700;margin-top:3px;line-height:1.45}.stars{letter-spacing:1px;font-size:19px}.episode-buttons{display:flex;gap:6px;flex-wrap:wrap}.ep-btn{min-width:42px;padding:7px 9px;border:3px solid var(--ink);border-radius:10px;background:#fff;box-shadow:2px 2px 0 var(--ink);cursor:pointer}.ep-btn.seen{background:var(--green)}.relation-row{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;margin-bottom:7px}.relation-row input{width:100%;border:3px solid var(--ink);border-radius:10px;padding:9px;background:#fff}.mini-sort{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.mini-sort .pixel{padding:7px 9px;font-size:11px}.color-options{display:flex;gap:8px;flex-wrap:wrap}.color-choice{width:34px;height:34px;border:3px solid var(--ink);border-radius:50%;cursor:pointer}.color-choice.selected{outline:4px solid #fff;box-shadow:0 0 0 4px var(--ink)}
@media(max-width:649px){.shelf{gap:8px}.shelf-item{padding:6px}.drama-row{padding:7px}.drama-row img{width:60px;height:80px}.drama-title{font-size:15px}.tabs{padding:9px 6px}.tab{padding:8px 6px;min-width:78px}}
</style>
</style>
</head>

<div class="app">
<header class="top">
  <div class="cover" id="cover">
    <div class="cover-default" id="coverDefault"><div><h1>潘朵拉的寶盒</h1><p>每一筆都是寶盒裡的收藏 💎</p></div></div>
    <img id="coverImg" style="display:none">
    <button class="pixel yellow cover-edit" onclick="pickCover()">🎮 更換封面</button>
    <input id="coverInput" type="file" accept="image/*" hidden onchange="setCover(event)">
  </div>
  <div class="brand"><div class="logo">★</div><div style="flex:1"><h1>潘朵拉的寶盒</h1><small>把每一筆收藏好好放進寶盒。</small></div><button class="pixel blue" onclick="backupCenter()">💾 備份</button></div>
</header>

<nav class="tabs" id="tabs">
  <button class="tab active" onclick="showTab(0)">🔮<br>預知未來</button>
  <button class="tab" onclick="showTab(1)">🏠<br>許願筆記</button>
  <button class="tab" onclick="showTab(2)">🧳<br>忘東忘西</button>
  <button class="tab" onclick="showTab(3)">💧<br>流水帳</button>
  <button class="tab" onclick="showTab(4)">💰<br>大筆洗錢</button>
  <button class="tab" onclick="showTab(5)">📦<br>長期資助</button>
  <button class="tab" onclick="showTab(6)">🎫<br>回訪資助</button>
  <button class="tab" onclick="showTab(7)">🔁<br>再刷十遍</button>
  <button class="tab" onclick="showTab(8)">❤️<br>有意思</button>
  <button class="tab" onclick="showTab(9)">📚<br>今天選誰</button>
  <button class="tab" onclick="showTab(10)">⏳<br>就等你了</button>
</nav>
<main id="main"></main>
</div>

function compressImage(file, maxSide=1400, quality=.72, cb){
 const r=new FileReader();
 r.onload=()=>{const img=new Image();img.onload=()=>{
   const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
   const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.naturalWidth*scale));c.height=Math.max(1,Math.round(img.naturalHeight*scale));
   const ctx=c.getContext('2d');ctx.drawImage(img,0,0,c.width,c.height);
   cb(c.toDataURL('image/jpeg',quality));
 };img.src=r.result};r.readAsDataURL(file)
}
function addPhotos(files,cb){
 const arr=Array.from(files||[]), out=[]; let left=arr.length;
 if(!left)return cb([]);
 arr.forEach(f=>compressImage(f,1000,.62,data=>{out.push(data);if(--left===0)cb(out)}))
}

let futureSortOrder=localStorage.getItem('oshiGameLedger_futureSort')||'desc';
let forgetSortOrder=localStorage.getItem('oshiGameLedger_forgetSort')||'desc';
let dramaSortOrders=JSON.parse(localStorage.getItem('oshiGameLedger_dramaSorts')||'{}');
function uid(prefix='id'){return prefix+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function safeText(v){return esc(v??'')}
function sortByTime(arr,key,order='desc'){return arr.map((x,i)=>({x,i})).sort((a,b)=>{const ad=a.x[key]||'',bd=b.x[key]||'';if(ad!==bd){const c=String(ad).localeCompare(String(bd));return order==='asc'?c:-c}return order==='asc'?a.i-b.i:b.i-a.i})}
function colorHex(c){return c||'#ffd21f'}
function colorPicker(id,selected){const cs=['#ff3b30','#ffd21f','#27c96f','#1687ff','#8b5cf6','#ff6fae','#ff9f1c','#9ca3af'];return `<div class="color-options" id="${id}">${cs.map(c=>`<button type="button" class="color-choice ${selected===c?'selected':''}" style="background:${c}" data-color="${c}" onclick="chooseColor('${id}','${c}')"></button>`).join('')}</div><input id="${id}-value" type="hidden" value="${esc(selected||cs[1])}">`}
function chooseColor(id,c){document.querySelectorAll('#'+id+' .color-choice').forEach(b=>b.classList.toggle('selected',b.dataset.color===c));const e=document.getElementById(id+'-value');if(e)e.value=c}

function futurePage(){
 const sorted=sortByTime(db.futureNotes,'updatedAt',futureSortOrder);const visible=sorted.filter(o=>!currentSearch||JSON.stringify(o.x).toLowerCase().includes(currentSearch.toLowerCase()));
 document.getElementById('main').innerHTML=`<section class="panel"><div class="hero-title"><h2>🔮 預知未來</h2><button class="pixel red" onclick="editFuture()">＋ 新增</button></div><p class="small">把平常要做的事、工作待辦先記下來。預設全部縮小。</p>${searchBar('搜尋記事本')}
 <div class="mini-sort"><button class="pixel ${futureSortOrder==='desc'?'blue':''}" onclick="setFutureSort('desc')">新到舊</button><button class="pixel ${futureSortOrder==='asc'?'blue':''}" onclick="setFutureSort('asc')">舊到新</button></div></section>
 <section class="list">${visible.length?visible.map(({x,i})=>`<article class="card note-card" style="border-left:8px solid ${colorHex(x.color)}"><div class="card-head" onclick="toggle('future-${x.id}')"><div class="left"><span class="color-dot" style="background:${colorHex(x.color)}"></span><div><div class="title">${safeText(x.title||'未命名')}</div><span class="category-pill" style="background:${colorHex(x.color)}">${safeText(x.category||'未分類')}</span></div></div><span>▼</span></div><div class="details" id="future-${x.id}"><div class="note-preview">${safeText(x.content||'')}</div><div class="actions"><button class="pixel blue" onclick="editFuture('${x.id}')">編輯</button><button class="pixel" onclick="delFuture('${x.id}')">刪除</button></div></div></article>`).join(''):`<div class="empty">還沒有記事。把未來要做的事寫下來吧 ✨</div>`}</section>`
}
function setFutureSort(o){futureSortOrder=o;localStorage.setItem('oshiGameLedger_futureSort',o);futurePage()}
function editFuture(id=null){const old=id?db.futureNotes.find(x=>x.id===id):{title:'',category:'工作',color:'#ffd21f',content:''};if(!old)return;openModal(id?'編輯預知未來':'新增預知未來',`<div class="field"><label>分類</label><input id="fcat" value="${safeText(old.category)}"></div><div class="field"><label>分類顏色</label>${colorPicker('fcolor',colorHex(old.color))}</div><div class="field"><label>標題</label><input id="ftitle" value="${safeText(old.title)}"></div><div class="field"><label>內容</label><textarea id="fcontent" placeholder="今天要做什麼？工作要處理什麼？">${safeText(old.content)}</textarea></div><button class="pixel green" onclick="saveFuture('${id||''}')">儲存</button>`)}
function saveFuture(id){const x={id:id||uid('future'),category:document.getElementById('fcat').value.trim()||'未分類',color:document.getElementById('fcolor-value').value,title:document.getElementById('ftitle').value.trim()||'未命名',content:document.getElementById('fcontent').value,updatedAt:new Date().toISOString()};const k=db.futureNotes.findIndex(v=>v.id===x.id);if(k<0)db.futureNotes.push(x);else db.futureNotes[k]=x;save();closeModal();futurePage()}
function delFuture(id){if(confirm('刪除這則記事？')){db.futureNotes=db.futureNotes.filter(x=>x.id!==id);save();futurePage()}}

function normalizeForgetList(x){
 x=x||{};x.id=x.id||uid('forgetlist');x.title=x.title||x.category||'未命名清單';x.category=x.category||'未分類';x.color=x.color||'#ffd21f';x.items=Array.isArray(x.items)?x.items:[];x.items=x.items.map(it=>({id:it.id||uid('forgetitem'),text:it.text||it.title||'',done:!!it.done,createdAt:it.createdAt||it.updatedAt||new Date().toISOString(),updatedAt:it.updatedAt||it.createdAt||new Date().toISOString()}));x.createdAt=x.createdAt||new Date().toISOString();x.updatedAt=x.updatedAt||x.createdAt;return x}
db.forgetLists=db.forgetLists.map(normalizeForgetList);
function forgetPage(){
 const sorted=sortByTime(db.forgetLists,'updatedAt',forgetSortOrder);const visible=sorted.filter(o=>!currentSearch||JSON.stringify(o.x).toLowerCase().includes(currentSearch.toLowerCase()));
 document.getElementById('main').innerHTML=`<section class="panel"><div class="hero-title"><h2>🧳 忘東忘西</h2><button class="pixel red" onclick="editForgetList()">＋ 新增清單</button></div><p class="small">每一格就是一份清單，例如「旅行要帶什麼」、「演唱會要帶什麼」。一份清單可以放很多事項；勾過的事項會變灰並自動移到最下面。</p>${searchBar('搜尋清單／事項')}
 <div class="mini-sort"><button class="pixel ${forgetSortOrder==='desc'?'blue':''}" onclick="setForgetSort('desc')">新到舊</button><button class="pixel ${forgetSortOrder==='asc'?'blue':''}" onclick="setForgetSort('asc')">舊到新</button><span class="small">共 ${db.forgetLists.length} 份清單</span></div></section>
 <section class="list">${visible.length?visible.map(({x})=>forgetListCard(x)).join(''):`<div class="empty">還沒有清單。先建立一份旅行、演唱會或住宿清單吧 🧳</div>`}</section>`
}
function forgetListCard(x){
 const items=[...(x.items||[])].sort((a,b)=>{if(!!a.done!==!!b.done)return a.done?1:-1;const ad=a.updatedAt||a.createdAt||'',bd=b.updatedAt||b.createdAt||'';return forgetSortOrder==='asc'?ad.localeCompare(bd):bd.localeCompare(ad)});
 const done=items.filter(i=>i.done).length;
 return `<article class="card checklist-card" style="border-left:8px solid ${colorHex(x.color)}"><div class="card-head" onclick="toggle('forgetlist-${x.id}')"><div class="left"><span class="color-dot" style="background:${colorHex(x.color)}"></span><div><div class="title">${safeText(x.title||'未命名清單')}</div><div><span class="category-pill" style="background:${colorHex(x.color)}">${safeText(x.category||'未分類')}</span><span class="small" style="margin-left:8px" data-forget-count="${x.id}">☑️ ${done}/${items.length}</span></div></div></div><span>▼</span></div>
 <div class="details" id="forgetlist-${x.id}"><div class="check-actions"><button class="pixel green" onclick="checkAllForget('${x.id}',true)">☑️ 一鍵全勾</button><button class="pixel" onclick="checkAllForget('${x.id}',false)">⬜ 一鍵全取消</button><button class="pixel blue" onclick="editForgetList('${x.id}')">編輯清單</button></div>
 <div class="checklist-items">${items.length?items.map(it=>`<div class="list-item ${it.done?'done':''}"><input type="checkbox" ${it.done?'checked':''} onchange="toggleForgetItem('${x.id}','${it.id}',this.checked)"><div class="item-title" style="flex:1"><span>${safeText(it.text||'未命名事項')}</span></div><button class="pixel" onclick="delForgetItem('${x.id}','${it.id}')">刪除</button></div>`).join(''):`<div class="empty">這份清單還沒有事項。</div>`}</div>
 <div class="inline-add"><input id="new-forget-${x.id}" placeholder="輸入新的事項，例如：充電器"><button class="pixel red" onclick="addForgetItem('${x.id}')">＋ 新增事項</button></div>
 <div class="actions"><button class="pixel" onclick="delForgetList('${x.id}')">刪除整份清單</button></div></div></article>`
}
function setForgetSort(o){forgetSortOrder=o;localStorage.setItem('oshiGameLedger_forgetSort',o);forgetPage()}
function editForgetList(id=null){
 const old=id?db.forgetLists.find(x=>x.id===id):{title:'',category:'旅行',color:'#ffd21f',items:[]};if(!old)return;
 const lines=(old.items||[]).map(i=>i.text).join('\\n');
 openModal(id?'編輯忘東忘西清單':'新增忘東忘西清單',`<div class="field"><label>清單名稱</label><input id="fltitle" value="${safeText(old.title)}" placeholder="例如：演唱會要帶的東西"></div><div class="field"><label>分類</label><input id="flcat" value="${safeText(old.category)}" placeholder="旅行／演唱會／住宿"></div><div class="field"><label>分類顏色</label>${colorPicker('flcolor',colorHex(old.color))}</div><div class="field"><label>事項（可一次輸入很多筆，一行一項）</label><textarea id="flitems" placeholder="充電器\\n行動電源\\n證件\\n水">${safeText(lines)}</textarea><div class="small">每一行會變成清單中的一個可勾選事項。編輯既有清單時，已經勾選的事項會保留勾選狀態。</div></div><button class="pixel green" onclick="saveForgetList('${id||''}')">儲存</button>`)
}
function saveForgetList(id){
 const old=id?db.forgetLists.find(x=>x.id===id):null;const texts=document.getElementById('flitems').value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);const oldItems=old?.items||[];
 const items=texts.map((text,i)=>{const same=oldItems[i];return {id:same?.id||uid('forgetitem'),text,done:!!same?.done,createdAt:same?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()}});
 const x={id:id||uid('forgetlist'),title:document.getElementById('fltitle').value.trim()||'未命名清單',category:document.getElementById('flcat').value.trim()||'未分類',color:document.getElementById('flcolor-value').value,items,createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};
 const k=db.forgetLists.findIndex(v=>v.id===x.id);if(k<0)db.forgetLists.push(x);else db.forgetLists[k]=x;save();closeModal();forgetPage()
}
function addForgetItem(listId){const input=document.getElementById('new-forget-'+listId);const text=(input?.value||'').trim();if(!text)return;const x=db.forgetLists.find(v=>v.id===listId);if(!x)return;x.items.push({id:uid('forgetitem'),text,done:false,createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()});x.updatedAt=new Date().toISOString();save();forgetPage()}
function toggleForgetItem(listId,itemId,done){
 const x=db.forgetLists.find(v=>v.id===listId),it=x?.items.find(v=>v.id===itemId);if(!it)return;
 it.done=done;it.updatedAt=new Date().toISOString();x.updatedAt=new Date().toISOString();save();
 // 只更新這一項並移動到清單底部，不重新渲染整頁，讓清單保持展開，方便連續勾選。
 const row=document.querySelector(`.checklist-items .list-item input[onchange*="'${itemId}'"]`)?.closest('.list-item');
 if(row){row.classList.toggle('done',done);const title=row.querySelector('.item-title');if(title)title.style.textDecoration=done?'line-through':'';const box=row.parentElement;if(done)box.appendChild(row);else{
   const rows=[...box.querySelectorAll('.list-item')];const firstDone=rows.find(r=>r.classList.contains('done'));if(firstDone)box.insertBefore(row,firstDone);else box.appendChild(row);
 }}
 const countEl=document.querySelector(`[data-forget-count="${listId}"]`);if(countEl){const n=x.items.filter(v=>v.done).length;countEl.textContent=`☑️ ${n}/${x.items.length}`}
}
function checkAllForget(listId,done){const x=db.forgetLists.find(v=>v.id===listId);if(!x)return;const now=new Date().toISOString();x.items.forEach(it=>{it.done=done;it.updatedAt=now});x.updatedAt=now;save();forgetPage()}
function delForgetItem(listId,itemId){const x=db.forgetLists.find(v=>v.id===listId);if(!x)return;if(confirm('刪除這個事項？')){x.items=x.items.filter(it=>it.id!==itemId);x.updatedAt=new Date().toISOString();save();forgetPage()}}
function delForgetList(id){if(confirm('刪除整份清單？')){db.forgetLists=db.forgetLists.filter(x=>x.id!==id);save();forgetPage()}}

function normalizeDrama(x){x.id=x.id||uid('drama');x.title=x.title||'';x.poster=x.poster||'';x.photos=Array.isArray(x.photos)?x.photos:[];x.genre=x.genre||'';x.episodes=Math.max(0,Number(x.episodes||0));x.rating=Math.min(5,Math.max(0,Number(x.rating||0)));x.leads=x.leads||'';x.supporting=x.supporting||'';x.synopsis=x.synopsis||'';x.airDate=x.airDate||'';x.watchTime=x.watchTime||'';x.platform=x.platform||'';x.rewatch=Math.max(0,Number(x.rewatch||0));x.relations=Array.isArray(x.relations)?x.relations:[];x.restraintTime=x.restraintTime||'';x.review=x.review||'';x.updateDay=x.updateDay||'';x.seenEpisodes=Array.isArray(x.seenEpisodes)?x.seenEpisodes:[];x.createdAt=x.createdAt||new Date().toISOString();x.updatedAt=x.updatedAt||x.createdAt;return x}
Object.keys(db.dramas).forEach(k=>db.dramas[k]=db.dramas[k].map(normalizeDrama));
function dramaSortKey(x){return x.airDate||x.updatedAt||x.createdAt||''}
function getDramaSort(page){return dramaSortOrders[page]||'desc'}
function setDramaSort(page,o){dramaSortOrders[page]=o;localStorage.setItem('oshiGameLedger_dramaSorts',JSON.stringify(dramaSortOrders));showDramaPage(page)}
function starHTML(r){r=Number(r||0);return '★'.repeat(r)+'☆'.repeat(5-r)}
function dramaSearch(arr){return arr.filter(x=>!currentSearch||JSON.stringify(x).toLowerCase().includes(currentSearch.toLowerCase()))}
function dramaImage(x){return x.poster||x.photos?.[0]||''}
function dramaCommonHeader(title,desc,page,addFn){return `<section class="panel"><div class="hero-title"><h2>${title}</h2><button class="pixel red" onclick="${addFn}">＋ 新增</button></div><p class="small">${desc}</p>${searchBar('搜尋劇名／演員／題材／平台')}<div class="mini-sort"><button class="pixel ${getDramaSort(page)==='desc'?'blue':''}" onclick="setDramaSort('${page}','desc')">新到舊</button><button class="pixel ${getDramaSort(page)==='asc'?'blue':''}" onclick="setDramaSort('${page}','asc')">舊到新</button></div></section>`}
function finishedCard(x){const img=dramaImage(x);return `<article class="drama-row" onclick="openDrama('${x.id}','finished')">${img?`<img src="${img}">`:''}<div class="drama-main"><div class="drama-title">${safeText(x.title||'未命名')}</div><div class="drama-meta">播出：${safeText(x.airDate||'未填')}<br>集數：${x.episodes||0}　⭐ ${starHTML(x.rating)}　主演：${safeText(x.leads||'未填')}<br>題材：${safeText(x.genre||'未填')}　🔁 刷 ${x.rewatch||0} 遍</div></div><span>▼</span></article>`}
function watchingCard(x){const seen=new Set(x.seenEpisodes||[]);const total=Math.max(0,x.episodes||0);return `<article class="drama-row" onclick="openDrama('${x.id}','watching')">${dramaImage(x)?`<img src="${dramaImage(x)}">`:''}<div class="drama-main"><div class="drama-title">${safeText(x.title||'未命名')}</div><div class="drama-meta">播出：${safeText(x.airDate||'未填')}　集數：${total}<br>主演：${safeText(x.leads||'未填')}　題材：${safeText(x.genre||'未填')}<br><strong>已看 ${seen.size}/${total}</strong>　更新：<strong>${safeText(x.updateDay||'未填')}</strong></div></div><span>▼</span></article>`}
function dramaFinished(){showDramaPage('finished')}
function dramaWatching(){showDramaPage('watching')}
function dramaSaved(){showDramaPage('saved')}
function dramaUpcoming(){showDramaPage('upcoming')}
function showDramaPage(page){
 migrateUpcoming();const titles={finished:'🔁 再刷十遍',watching:'❤️ 有意思',saved:'📚 今天選誰',upcoming:'⏳ 就等你了'};const desc={finished:'看完的劇全部收在這裡。每部先縮小顯示，點一下才看完整資料。',watching:'正在追的劇。每一集都是按鈕，看完一集就按亮，全部看完會自動移到「再刷十遍」。',saved:'先存起來慢慢選。像網路小說書架一樣看劇照，點進去再決定。',upcoming:'還沒開播的劇。開播時間到了會自動移到「今天選誰」。'};const arr=dramaSearch(sortByTime(db.dramas[page],page==='saved'||page==='upcoming'?'createdAt':'updatedAt',getDramaSort(page)).map(o=>o.x));
 let body=dramaCommonHeader(titles[page],desc[page],page,`addDrama('${page}')`);
 if(page==='saved'||page==='upcoming')body+=`<section class="shelf">${arr.length?arr.map(x=>shelfCard(x,page)).join(''):`<div class="empty" style="grid-column:1/-1">目前沒有劇單。</div>`}</section>`;else body+=`<section class="list">${arr.length?arr.map(x=>page==='finished'?finishedCard(x):watchingCard(x)).join(''):`<div class="empty">目前沒有劇單。</div>`}</section>`;
 document.getElementById('main').innerHTML=body
}
function shelfCard(x,page){const img=dramaImage(x);return `<article class="shelf-item" onclick="openDrama('${x.id}','${page}')">${img?`<img src="${img}">`:`<div style="aspect-ratio:3/4;border:3px solid var(--ink);border-radius:10px;display:grid;place-items:center;background:#eee">🎬</div>`}<div class="shelf-title">${safeText(x.title||'未命名')}</div><div class="shelf-meta">${safeText(x.genre||'未填題材')}　｜　${x.episodes||0} 集</div></article>`}
function addDrama(page,id=null){const list=db.dramas[page],old=id?list.find(x=>x.id===id):normalizeDrama({id:uid('drama'),createdAt:new Date().toISOString(),updatedAt:new Date().toISOString(),seenEpisodes:[]});if(!old)return;openDramaForm(page,old,id)}
function openDrama(id,page){const x=db.dramas[page].find(v=>v.id===id);if(!x)return;openDramaForm(page,x,id,true)}
function openDramaForm(page,x,id,isDetail=false){
 x=normalizeDrama(x);const isWatching=page==='watching';const isShelf=page==='saved'||page==='upcoming';const title=isDetail?'查看／編輯劇集':'新增劇集';
 let body=`<div class="field"><label>劇名</label><input id="dt" value="${safeText(x.title)}"></div><div class="field"><label>劇照（可多張，第一張作為封面）</label><input id="dph" type="file" accept="image/*" multiple></div><div class="row"><div class="field"><label>題材</label><input id="dg" value="${safeText(x.genre)}"></div><div class="field"><label>集數</label><input id="deps" type="number" min="0" value="${x.episodes}"></div></div><div class="field"><label>劇播時間日期</label><input id="dair" type="datetime-local" value="${safeText(x.airDate)}"></div>`;
 if(isWatching)body+=`<div class="field"><label>更新時間（每週幾更新）</label><input id="dupdate" value="${safeText(x.updateDay)}" placeholder="例如：每週五 20:00"><div class="ok">📢 更新時間會特別顯眼地顯示在「有意思」。</div></div>`;
 body+=`<div class="field"><label>主演</label><input id="dlead" value="${safeText(x.leads)}"></div><div class="field"><label>配角</label><input id="dsupport" value="${safeText(x.supporting)}"></div><div class="field"><label>劇情簡介</label><textarea id="dsynopsis">${safeText(x.synopsis)}</textarea></div><div class="field"><label>看劇時間</label><input id="dwatch" value="${safeText(x.watchTime)}"></div><div class="field"><label>在哪個平台觀看</label><input id="dplatform" value="${safeText(x.platform)}"></div><div class="field"><label>我的評分（最高5星）</label><select id="drating">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${Number(x.rating)===n?'selected':''}>${n} ${starHTML(n)}</option>`).join('')}</select></div><div class="field"><label>我刷幾遍</label><input id="drewatch" type="number" min="0" value="${x.rewatch}"></div>`;
 body+=`<div class="field"><label>特攝／男團關聯（可新增多項）</label><div id="relations">${(x.relations||[]).map(r=>`<div class="relation-row"><input class="relation-input" value="${safeText(r)}"><button class="pixel" type="button" onclick="this.parentElement.remove()">刪除</button></div>`).join('')}</div><div class="actions"><button class="pixel blue" type="button" onclick="addRelationRow()">＋ 新增一列</button></div></div>`;
 body+=`<div class="field"><label>克制Time</label><textarea id="drestraint" placeholder="例如：第3集，1時12分08秒，有吻戲">${safeText(x.restraintTime)}</textarea></div><div class="field"><label>觀看心得</label><textarea id="dreview">${safeText(x.review)}</textarea></div>`;
 if(isWatching)body+=`<div class="field"><label>已看集數</label><div class="episode-buttons" id="epsBtns">${Array.from({length:x.episodes||0},(_,i)=>{const n=i+1,seen=(x.seenEpisodes||[]).includes(n);return `<button type="button" class="ep-btn ${seen?'seen':''}" onclick="toggleEpTemp(this,${n})">${n}</button>`}).join('')}</div><div class="small">全部按亮後會自動移到「再刷十遍」。</div></div>`;
 body+=`<div class="actions"><button class="pixel green" type="button" onclick="saveDrama('${page}','${id||''}')">儲存</button>${isShelf?`<button class="pixel yellow" type="button" onclick="markDramaWatched('${page}','${id}')">☑️ 已看，移到「有意思」</button>`:''}${id?`<button class="pixel" type="button" onclick="deleteDrama('${page}','${id}')">刪除</button>`:''}</div>`;
 openModal(title,body)
}
function addRelationRow(){const c=document.getElementById('relations');const d=document.createElement('div');d.className='relation-row';d.innerHTML='<input class="relation-input"><button class="pixel" type="button" onclick="this.parentElement.remove()">刪除</button>';c.appendChild(d)}
function toggleEpTemp(btn,n){btn.classList.toggle('seen')}
function saveDrama(page,id){
 const old=id?db.dramas[page].find(x=>x.id===id):null;const files=document.getElementById('dph').files;addPhotos(files,photos=>{
  const total=Math.max(0,Number(document.getElementById('deps').value||0));const seen=Array.from(document.querySelectorAll('#epsBtns .ep-btn.seen')).map(b=>Number(b.textContent)).filter(n=>n<=total);let x={id:id||uid('drama'),title:document.getElementById('dt').value.trim(),genre:document.getElementById('dg').value,episodes:total,airDate:document.getElementById('dair').value,leads:document.getElementById('dlead').value,supporting:document.getElementById('dsupport').value,synopsis:document.getElementById('dsynopsis').value,watchTime:document.getElementById('dwatch').value,platform:document.getElementById('dplatform').value,rating:Number(document.getElementById('drating').value||0),rewatch:Number(document.getElementById('drewatch').value||0),relations:Array.from(document.querySelectorAll('.relation-input')).map(e=>e.value.trim()).filter(Boolean),restraintTime:document.getElementById('drestraint').value,review:document.getElementById('dreview').value,photos:photos.length?photos:(old?.photos||[]),poster:(photos[0]||old?.poster||''),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString(),updateDay:document.getElementById('dupdate')?.value||old?.updateDay||'',seenEpisodes:page==='watching'?seen:(old?.seenEpisodes||[])};
  x=normalizeDrama(x);let target=page;
  if(page==='saved'&&false)target='saved';
  if(page==='watching'&&x.episodes>0&&seen.length>=x.episodes){target='finished';x.seenEpisodes=[]}
  const oldIndex=db.dramas[page].findIndex(v=>v.id===x.id);if(oldIndex>=0)db.dramas[page].splice(oldIndex,1);if(target==='finished'){x.rewatch=Math.max(1,x.rewatch||0);db.dramas.finished.push(x)}else db.dramas[target].push(x);
  save();closeModal();showDramaPage(target)
 })
}
function deleteDrama(page,id){if(confirm('刪除這部劇？')){db.dramas[page]=db.dramas[page].filter(x=>x.id!==id);save();closeModal();showDramaPage(page)}}
function markDramaWatched(page,id){const x=db.dramas[page].find(v=>v.id===id);if(!x)return;db.dramas[page]=db.dramas[page].filter(v=>v.id!==id);x.updatedAt=new Date().toISOString();x.seenEpisodes=[];db.dramas.watching.push(x);save();closeModal();showDramaPage('watching')}
function migrateUpcoming(){const now=Date.now();const move=[];db.dramas.upcoming.forEach(x=>{if(x.airDate&&new Date(x.airDate).getTime()<=now)move.push(x)});if(move.length){db.dramas.upcoming=db.dramas.upcoming.filter(x=>!move.includes(x));db.dramas.saved.push(...move);save()}}

function backupCenter(){
 const count=db.ledgers.reduce((s,a)=>s+a.length,0)+db.wishlist.length+db.futureNotes.length+db.forgetLists.reduce((s,x)=>s+(x.items?.length||0),0)+Object.values(db.dramas).reduce((s,a)=>s+a.length,0);
 const last=localStorage.getItem('oshiGameLedger_lastBackup')||'尚未備份';
 openModal('💾 通用備份中心',`<div class="panel" style="box-shadow:none;margin-top:10px">
 <h3>資料安全中心</h3><p>目前資料：<strong>${count}</strong> 筆</p>
 <p class="small">最後完整備份：${esc(last)}</p>
 <div class="actions">
  <button class="pixel green" onclick="exportUniversalBackup()">📦 完整備份 ZIP</button>
  <button class="pixel blue" onclick="exportCSV()">📊 通用 CSV</button>

 </div>
 <div class="ok">完整 ZIP 會保存：四個帳本、購買清單、封面、所有照片、結構化 JSON、CSV、README。未來即使換 App，也可以用 JSON／CSV／照片資料重新製作。</div>
 <div class="warn" style="border-color:var(--blue);color:var(--ink);background:#e8f4ff">建議備份後把 ZIP 存到 Google Drive、電腦或 USB，不要只留在手機。</div>
 </div>`)
}
function stripImages(){
 const x=JSON.parse(JSON.stringify(db));
 x.cover='';
 x.ledgers.forEach(a=>a.forEach(v=>{delete v.photos;delete v.photo}));
 x.wishlist.forEach(v=>delete v.photo);
 return x;
}
function getImages(){
 const a=[];
 if(db.cover)a.push(['cover',db.cover]);
 db.ledgers.forEach((arr,li)=>arr.forEach((x,i)=>(x.photos||[]).forEach((p,j)=>a.push([`ledger${li+1}_${i+1}_${j+1}`,p]))));
 db.wishlist.forEach((x,i)=>{if(x.photo)a.push([`wishlist_${i+1}`,x.photo])});
 if(db.dramas)Object.entries(db.dramas).forEach(([bucket,arr])=>arr.forEach((x,i)=>{(x.photos||[]).forEach((p,j)=>a.push([`drama_${bucket}_${i+1}_${j+1}`,p]))}));
 return a;
}
function csvCell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}
function makeCSV(headers,rows){return '\uFEFF'+[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\n')}

 zip.file('csv/流水帳.csv',makeCSV(['日期','項目','類型','金額'],db.ledgers[0].map(x=>[x.date,x.name,x.type,x.amount])));
 zip.file('csv/大筆洗錢.csv',makeCSV(['日期','項目','類型','金額'],db.ledgers[1].map(x=>[x.date,x.name,x.type,x.amount])));
 zip.file('csv/長期資助.csv',makeCSV(['取貨平台','購買物品','週邊名稱','賣家','賣家來源','商品價格','運費','已付款金額','收貨狀態','備註'],db.ledgers[2].map(x=>[x.platform,x.item,x.name,x.seller,x.source,x.price,x.shipping,x.paid,x.status,x.note])));
 zip.file('csv/回訪資助.csv',makeCSV(['活動名稱','日期','開始時間','結束時間','城市／場館','購票平台','票種／座位','票價','交通工具','交通費','住宿飯店','住宿費','其他','其他金額','總額','已付款','付款狀態','完成狀態','備註'],db.ledgers[3].map(x=>[x.name,x.date,x.start,x.end,x.venue,x.ticketPlatform,x.seat,x.ticket,x.transportTool,x.transport,x.hotel,x.hotelCost,x.other,x.otherCost,x.total,x.paid,x.paid>=x.total?'已付款':'未付款',x.status,x.note])));
 zip.file('csv/購買清單.csv',makeCSV(['想買的東西','預估價格','狀態','備註'],db.wishlist.map(x=>[x.name,x.price,x.bought?'已買':'想買',x.note])));
 zip.file('csv/預知未來.csv',makeCSV(['分類','顏色','標題','內容','更新時間'],db.futureNotes.map(x=>[x.category,x.color,x.title,x.content,x.updatedAt])));
 zip.file('csv/忘東忘西.csv',makeCSV(['清單名稱','分類','顏色','事項','完成','更新時間'],db.forgetLists.flatMap(x=>(x.items||[]).map(it=>[x.title,x.category,x.color,it.text,it.done?'已勾':'未勾',it.updatedAt]))));
 ['finished','watching','saved','upcoming'].forEach(k=>zip.file(`csv/${k}.csv`,makeCSV(['劇名','題材','集數','評分','主演','配角','播出時間','看劇時間','平台','刷幾遍','更新時間','簡介','心得'],db.dramas[k].map(x=>[x.title,x.genre,x.episodes,x.rating,x.leads,x.supporting,x.airDate,x.watchTime,x.platform,x.rewatch,x.updateDay,x.synopsis,x.review]))));
}
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function dataUrlBlob(data){const [meta,b64]=data.split(',');const mime=(meta.match(/data:(.*?);base64/)||[])[1]||'application/octet-stream';const raw=atob(b64);const u=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)u[i]=raw.charCodeAt(i);return new Blob([u],{type:mime})}
async function exportUniversalBackup(){
 if(!window.JSZip){alert('備份模組載入失敗，請重新開啟 App。');return}
 const zip=new JSZip(), imgs=getImages();
 zip.file('README.txt','潘朵拉的寶盒｜通用完整備份\n\n本備份包含所有帳本、預知未來、忘東忘西、四個追劇清單、data.json、CSV、封面與照片。data.json 可供其他程式讀取，CSV 可用 Excel／Google 試算表開啟，images 資料夾保存圖片。\n');
 zip.file('manifest.json',JSON.stringify({format:'oshi-ledger-universal',version:1,app:'潘朵拉的寶盒',exportedAt:new Date().toISOString(),imageCount:imgs.length},null,2));
 zip.file('data.json',JSON.stringify(stripImages(),null,2));
 zip.file('data_with_images.json',JSON.stringify(db,null,2));
 imgs.forEach(([label,data],i)=>{const blob=dataUrlBlob(data);zip.file(`images/${String(i+1).padStart(3,'0')}_${label}.bin`,blob)});
 zip.file('images/index.json',JSON.stringify(imgs.map((x,i)=>({label:x[0],path:`images/${String(i+1).padStart(3,'0')}_${x[0]}.bin`})),null,2));
 addUniversalCSVs(zip);
 const blob=await zip.generateAsync({type:'blob'});
 downloadBlob(blob,`潘朵拉的寶盒_通用完整備份_${new Date().toISOString().slice(0,10)}.zip`);
 localStorage.setItem('oshiGameLedger_lastBackup',new Date().toLocaleString('zh-TW'));
 closeModal();alert('完整通用備份已建立！請把 ZIP 存到雲端或電腦。');
}
async function exportCSV(){
 if(!window.JSZip){alert('備份模組載入失敗，請重新開啟 App。');return}
 const zip=new JSZip();addUniversalCSVs(zip);downloadBlob(await zip.generateAsync({type:'blob'}),`潘朵拉的寶盒_CSV_${new Date().toISOString().slice(0,10)}.zip`)
}
async function importUniversalBackup(e){
 const f=e.target.files[0];if(!f)return;
 try{
  if(!window.JSZip)throw new Error('JSZip');
  if(!confirm('匯入會取代目前資料。請先備份目前資料。確定繼續嗎？'))return;
  const zip=await JSZip.loadAsync(f);
  let file=zip.file('data_with_images.json')||zip.file('data.json');
  if(!file)throw new Error('data');
  const d=JSON.parse(await file.async('string'));
  if(!Array.isArray(d.ledgers)||!Array.isArray(d.wishlist))throw new Error('format');
  if(!d.cover)d.cover='';
  const indexFile=zip.file('images/index.json');
  if(indexFile){
   const index=JSON.parse(await indexFile.async('string'));const map={};
   for(const item of index){const q=zip.file(item.path);if(!q)continue;const blob=await q.async('blob');const data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(blob)});map[item.label]=data}
   if(map.cover)d.cover=map.cover;
   d.ledgers.forEach((arr,li)=>arr.forEach((x,i)=>{const ps=Object.keys(map).filter(k=>k.startsWith(`ledger${li+1}_${i+1}_`)).sort().map(k=>map[k]);if(ps.length)x.photos=ps}));
   d.wishlist.forEach((x,i)=>{if(map[`wishlist_${i+1}`])x.photo=map[`wishlist_${i+1}`]});
   if(d.dramas)Object.entries(d.dramas).forEach(([bucket,arr])=>arr.forEach((x,i)=>{const ps=Object.keys(map).filter(k=>k.startsWith(`drama_${bucket}_${i+1}_`)).sort().map(k=>map[k]);if(ps.length){x.photos=ps;x.poster=x.poster||ps[0]}}));
  }
  if(!Array.isArray(d.futureNotes))d.futureNotes=[];if(!Array.isArray(d.forgetList))d.forgetList=[];if(!Array.isArray(d.forgetLists))d.forgetLists=[];if(d.forgetLists.length===0&&d.forgetList.length){const groups={};d.forgetList.forEach(x=>{const key=(x.category||'未分類')+'\u0000'+(x.color||'#ffd21f');if(!groups[key])groups[key]={id:uid('forgetlist'),title:x.category||'未分類',category:x.category||'未分類',color:x.color||'#ffd21f',items:[],createdAt:x.updatedAt||new Date().toISOString(),updatedAt:x.updatedAt||new Date().toISOString()};groups[key].items.push({id:x.id||uid('forgetitem'),text:x.title||'',done:!!x.done,createdAt:x.updatedAt||new Date().toISOString(),updatedAt:x.updatedAt||new Date().toISOString()})});d.forgetLists=Object.values(groups)};d.forgetLists=d.forgetLists.map(normalizeForgetList);if(!d.dramas)d.dramas={finished:[],watching:[],saved:[],upcoming:[]};['finished','watching','saved','upcoming'].forEach(k=>{if(!Array.isArray(d.dramas[k]))d.dramas[k]=[];d.dramas[k]=d.dramas[k].map(normalizeDrama)});
  db=d;save();renderCover();closeModal();showTab(0);alert('通用完整備份恢復完成！');
 }catch(err){console.error(err);alert('無法匯入：請選擇有效的通用完整備份 ZIP。')}
}

renderCover();migrateUpcoming();showTab(0);setInterval(()=>{if(document.visibilityState!=='hidden')migrateUpcoming()},60000);
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{});}</script><script id="auto-backup-v39">
(function(){
  const DB="yebuzufinal-auto-backup", STORE="snapshots", MAX=5;
  function db(){
    return new Promise((ok,no)=>{
      const r=indexedDB.open(DB,1);
      r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:"id"});
      r.onsuccess=()=>ok(r.result); r.onerror=()=>no(r.error);
    });
  }
  async function snap(reason){
    try{
      const d=await db();
      const item={id:Date.now(),time:new Date().toISOString(),reason,
        data:Object.fromEntries(Object.entries(localStorage))};
      await new Promise((ok,no)=>{
        const t=d.transaction(STORE,"readwrite");
        t.objectStore(STORE).put(item); t.oncomplete=ok; t.onerror=()=>no(t.error);
      });
      const all=await new Promise((ok,no)=>{
        const t=d.transaction(STORE,"readonly"),q=t.objectStore(STORE).getAll();
        q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error);
      });
      all.sort((a,b)=>b.id-a.id).slice(MAX).forEach(x=>{
        d.transaction(STORE,"readwrite").objectStore(STORE).delete(x.id);
      });
    }catch(e){}
  }
  setTimeout(()=>snap("app-open"),2000);
  setInterval(()=>snap("every-10-minutes"),600000);
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState==="hidden") snap("background");
  });
  window.addEventListener("pagehide",()=>snap("pagehide"));
  window.__autoBackupNow=()=>snap("manual");
})();
</script></body></html>
